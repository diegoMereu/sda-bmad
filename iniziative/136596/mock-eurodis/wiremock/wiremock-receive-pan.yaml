apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock-mock
  template:
    metadata:
      labels:
        app: wiremock-mock
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.2-2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: wiremock-config
              mountPath: /home/wiremock/mappings
              readOnly: true
      volumes:
        - name: wiremock-config
          configMap:
            name: wiremock-config
            items:
              - key: shipments.json
                path: shipments.json
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock-mock
spec:
  type: ClusterIP
  selector:
    app: wiremock-mock
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
